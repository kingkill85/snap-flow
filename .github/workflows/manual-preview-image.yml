name: Build exact-SHA preview image

on:
  workflow_dispatch:
    inputs:
      requested_sha:
        description: Full 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested SHA
        env:
          REQUESTED_SHA: ${{ inputs.requested_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}

      - name: Verify exact checkout
        env:
          REQUESTED_SHA: ${{ inputs.requested_sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push immutable preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ inputs.requested_sha }}
          build-args: |
            BUILD_SHA=${{ inputs.requested_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
