{
  "services": {
    "receiver": {
      "entrypoint": ["python3"],
      "working_dir": "/app",
      "environment": {"PYTHONDONTWRITEBYTECODE": "1", "PYTHONPATH": "/app"},
      "volumes": [
        "/opt/data/services/snapflow-neo-dev-webhook:/app:ro",
        "/var/lib/neo-dev:/var/lib/neo-dev",
        "/opt/data:/opt/data:ro"
      ],
      "command": ["-m", "neo_dev_webhook.server", "--host", "0.0.0.0", "--port", "8787", "--concurrency-limit", "8", "--read-timeout", "5"]
    },
    "consumer": {
      "entrypoint": ["python3"],
      "working_dir": "/app",
      "environment": {"PYTHONDONTWRITEBYTECODE": "1", "PYTHONPATH": "/app", "NEO_DEV_CARD_POLICY": "/app/card-capability-policy.json"},
      "volumes": [
        "/opt/data/services/snapflow-neo-dev-webhook:/app:ro",
        "/var/lib/neo-dev:/var/lib/neo-dev",
        "/opt/data:/opt/data:ro"
      ],
      "command": ["-m", "neo_dev_webhook.consumer", "/var/lib/neo-dev/neo-dev.sqlite", "--max-runtime", "2h", "--max-attempts", "5"]
    }
  }
}
