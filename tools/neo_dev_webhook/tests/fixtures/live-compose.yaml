services:
  receiver:
    command: "exec python3 -m neo_dev_webhook.server --host 0.0.0.0 --port 8787"
    environment:
      NEO_DEV_WEBHOOK_SECRET: fixture-secret
      NEO_DEV_TASK_RUNNER: /opt/data/scripts/neo-dev/task.py
    volumes:
      - /opt/data/services/snapflow-neo-dev-webhook/src:/srv/webhook:ro
      - ./passwd:/etc/passwd:ro
      - ./group:/etc/group:ro
      - /opt/data:/opt/data:ro
