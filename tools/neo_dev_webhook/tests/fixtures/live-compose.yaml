services:
  receiver:
    command: "exec python3 -m neo_dev_webhook.server --host 0.0.0.0 --port 8787"
    env_file: ./webhook.env
    environment:
      NEO_DEV_TASK_RUNNER: /opt/data/scripts/neo-dev/task.py
    volumes:
      - /mnt/marder/docker/hermes/data/services/snapflow-neo-dev-webhook/src:/srv/webhook:ro
      - ./passwd:/etc/passwd:ro
      - ./group:/etc/group:ro
      - /mnt/marder/docker/hermes/data:/opt/data
    networks:
      - proxy
networks:
  proxy:
    external: true
